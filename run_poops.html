<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pes Club - Poops Chain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-logo">PES</div>
            <div class="brand-text">
                <span class="brand-name">Pes Club | بكر همام</span>
                <span class="brand-sub">تعديل وبرمجة البلايستيشن</span>
            </div>
        </div>
        <div class="badge">Poops Chain</div>
    </header>

    <main class="wrap">
        <section class="hero">
            <h1 class="hero-title">Poops <span class="accent">Exploit</span></h1>
            <p class="hero-sub">دعم الإصدارات: 12.50 - 13.00</p>
        </section>

        <section class="status-panel">
            <span id="state" class="status-text loading">⏳ جاري التحميل، يرجى الانتظار...</span>
            <br>
            <button id="retry" class="btn hidden" type="button">↻ إعادة المحاولة</button>
        </section>
        <div id="out" style="display:none;"></div>
    </main>

    <footer class="foot">
        <p>📍 <strong>العنوان:</strong> سوهاج، مركز البلينا، بجوار البنك الأهلي</p>
        <p>📞 <strong>للتواصل:</strong> +20 10 07707745</p>
    </footer>
</div>

<script type="module">
    var started = false;
    function boot() {
        if (started) return;
        started = true;
        import("./chain_poops.js").catch(function(e) {
            var stateEl = document.getElementById("state");
            stateEl.innerHTML = "❌ فشل: " + (e && e.message ? e.message : e);
            stateEl.className = "status-text error";
            var btn = document.getElementById("retry");
            if (btn) btn.className = "btn";
        });
    }
    function bootSettled() { setTimeout(boot, 1200); }
    var appCache = window.applicationCache;
    if (appCache) {
        appCache.addEventListener('cached', bootSettled, false);
        appCache.addEventListener('noupdate', bootSettled, false);
        appCache.addEventListener('error', bootSettled, false);
        appCache.addEventListener('obsolete', bootSettled, false);
        setTimeout(bootSettled, 6000);
    } else {
        bootSettled();
    }
    document.getElementById("retry").addEventListener("click", function() { location.reload(); }, false);
    window.addEventListener("error", function(e) {
        var stateEl = document.getElementById("state");
        if (stateEl && stateEl.textContent.includes("⏳")) {
            stateEl.innerHTML = "❌ خطأ: " + (e && e.message ? e.message : "Script error");
            stateEl.className = "status-text error";
        }
    }, false);
</script>
</body>
</html>
